name: Build & Update GitHub Pages Bundle on main

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages-bundle"
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate DU question datasets
        run: npm run check:du

      - name: Build production bundle for main /(root)
        run: npm run build

      - name: Commit updated dist-bundle to branch if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist-bundle index.html 404.html .nojekyll package-lock.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update prebuilt bundle for GitHub Pages main branch [skip ci]"
            git push || echo "Push skipped or token is read-only. Bundle is already up-to-date."
          fi
